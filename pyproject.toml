[project]
name = "gameflow"
version = "0.1.0"
description = "Event-driven progression platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "PyJWT>=2.10.1",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
